services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: torque
      POSTGRES_USER: ${DB_USER:-torque}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-torque}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-torque} -d torque"]
      interval: 5s
      retries: 10

  # Imagem única (Dockerfile da raiz): API + frontend em http://localhost:8080.
  # Uso: JWT_SECRET=... ADMIN_EMAIL=... ADMIN_SENHA=... docker compose up -d --build
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/torque
      DB_USER: ${DB_USER:-torque}
      DB_PASSWORD: ${DB_PASSWORD:-torque}
      JWT_SECRET: ${JWT_SECRET:-}   # obrigatória: sem ela a API não sobe
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
