<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body { background: #1F3A5F; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.brand { color: #fff; text-align: center; margin-bottom: 28px; }
.brand .logo { justify-content: center; font-size: 30px; }
.brand p { color: #B8C7DB; font-size: 13px; margin-top: 6px; }
.box { width: 100%; background: #fff; border-radius: 14px; padding: 26px 22px; }
.box h2 { font-size: 18px; margin-bottom: 4px; }
.box .sub { font-size: 13px; color: #6B7787; margin-bottom: 20px; }
.field { margin-bottom: 14px; }
.row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin: 4px 0 18px; }
.row a { color: #1F5FAF; text-decoration: none; font-weight: 600; }
.err { background: #FDE7E7; color: #B42318; font-size: 12.5px; padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; }
.btn { width: 100%; padding: 12px; font-size: 14.5px; }
.foot { color: #8FA3BF; font-size: 11.5px; margin-top: 22px; }
</style></head><body>
<div class="brand"><div class="logo"><span class="dot"></span>Torque</div><p>Ordens de serviço da sua oficina</p></div>
<div class="box">
  <h2>Entrar</h2><div class="sub">Use o e-mail cadastrado pelo administrador.</div>
  <div class="err">E-mail ou senha inválidos</div>
  <div class="field"><label class="lbl">E-mail</label><input class="input" value="joao@oficinadojoao.com.br"></div>
  <div class="field"><label class="lbl">Senha</label><input class="input" type="password" value="........"></div>
  <div style="height:8px"></div>
  <button class="btn primary">Entrar</button>
</div>
<div class="foot">Torque · versão MVP</div>
</body></html>
