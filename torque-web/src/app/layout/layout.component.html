<mat-sidenav-container class="casca">
  <mat-sidenav
    #menu class="lateral" [mode]="celular() ? 'over' : 'side'" [opened]="!celular()" [fixedInViewport]="celular()"
    aria-label="Menu lateral"
  >
    <a class="logo" routerLink="/quadro"><span class="icone" aria-hidden="true"></span>Torque</a>

    <p class="grupo">Gestão da oficina</p>
    <nav class="nav" aria-label="Menu principal">
      @for (item of itens(); track item.rota) {
        <a [routerLink]="item.rota" routerLinkActive="on" (click)="celular() && menu.close()" data-testid="item-menu">
          <span class="icone" [style.--icone]="icone(item)" aria-hidden="true"></span>{{ item.rotulo }}
        </a>
      }
    </nav>

    <p class="versao">Torque · versão MVP</p>
    <p class="credito" data-testid="credito">Desenvolvido por <br /><b>Gabriel Medeiros de Mendonça</b></p>
  </mat-sidenav>

  <mat-sidenav-content class="conteudo">
    <header class="topo">
      @if (celular()) {
        <button mat-icon-button (click)="menu.toggle()" aria-label="Abrir menu" data-testid="abrir-menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <nav class="trilha" aria-label="Você está em" data-testid="trilha">
        <span>Oficina</span> / <b>{{ secao() }}</b>
      </nav>

      <button type="button" class="usuario" [matMenuTriggerFor]="menuUsuario" aria-label="Menu do usuário">
        <span class="avatar">{{ iniciais() }}</span>
        <span class="nome so-tela-grande">
          <strong>{{ usuario()?.nome }}</strong>
          <small>{{ rotuloPerfil() }}</small>
        </span>
        <mat-icon class="so-tela-grande">expand_more</mat-icon>
      </button>
    </header>

    <main class="pagina">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-menu #menuUsuario="matMenu" xPosition="before">
  <div class="menu-cabecalho" mat-menu-item disabled>
    {{ usuario()?.nome }} · {{ rotuloPerfil() }}
  </div>
  <button mat-menu-item (click)="sair()" data-testid="sair">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
